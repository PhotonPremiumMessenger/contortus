<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CONTORTUS</title>
  <meta name="description" content="Стример, создатель контента">
  <meta property="og:title" content="CONTORTUS">
  <meta property="og:description" content="Стример, создатель контента">
  <meta property="og:type" content="website">
  <style>
    /* ============ ШРИФТЫ ============ */
    /* Unbounded — для имени. Manrope — для текста.
       Plus Jakarta Sans — для кнопок (современный, стильный). */
    @import url('https://fonts.googleapis.com/css2?family=Unbounded:wght@600;700;800;900&family=Manrope:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap');

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --radius: 18px;
      --orange: #ff7a1a;
      --pink: #ff2d95;
      --magenta: #d100ff;
      --red: #ff3b3b;
      /* Кнопки стали чуть плотнее — фон хуже виден */
      --bg-card: rgba(12, 6, 16, 0.72);
      --bg-card-hover: rgba(28, 10, 32, 0.9);
      --border-card: rgba(255, 122, 26, 0.45);
      --text: #ffffff;
      --text-secondary: rgba(255, 255, 255, 0.6);
      --shadow: 0 10px 40px rgba(255, 45, 149, 0.35);
    }

    html {
      background: #0a0208;
      min-height: 100vh;
      min-height: 100dvh;
    }

    body {
      font-family: 'Manrope', -apple-system, BlinkMacSystemFont, sans-serif;
      background: transparent;
      color: var(--text);
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;
      position: relative;
    }

    /* ============ ВИДЕО-ФОН ============ */
    .bg-video {
      position: fixed;
      top: 0; left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      object-position: center center;
      z-index: -3;
      filter: saturate(1.2) brightness(0.85) blur(9px);
      pointer-events: none;
      transform: scale(1.05);
    }
    @media (max-width: 768px) {
      .bg-video { filter: saturate(1.2) brightness(0.85) blur(13px); }
    }

    .bg-overlay {
      position: fixed;
      inset: 0;
      background:
        linear-gradient(135deg,
          rgba(255, 45, 149, 0.08) 0%,
          rgba(0, 0, 0, 0.35) 45%,
          rgba(255, 122, 26, 0.08) 100%);
      z-index: -2;
      pointer-events: none;
    }
    .bg-shine {
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background:
        radial-gradient(circle at 20% 20%, rgba(255, 45, 149, 0.12), transparent 45%),
        radial-gradient(circle at 80% 80%, rgba(255, 122, 26, 0.12), transparent 45%);
      animation: bgPulse 8s ease-in-out infinite alternate;
    }
    @keyframes bgPulse {
      0%   { opacity: 0.6; transform: scale(1); }
      100% { opacity: 1;   transform: scale(1.08); }
    }

    /* ============ КОНТЕЙНЕР ============ */
    .container {
      width: 100%;
      max-width: 460px;
      margin: 0 auto;
      padding: 32px 20px 40px;
      position: relative;
      z-index: 1;
    }

    /* ============ ПРОФИЛЬ ============ */
    .profile {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 22px;
    }
    .avatar {
      width: 140px;
      height: 140px;
      margin-bottom: 16px;
      animation: floatAvatar 4s ease-in-out infinite;
      position: relative;
    }
    .avatar img {
      width: 100%; height: 100%;
      border-radius: 50%;
      display: block;
      object-fit: cover;
      border: 3px solid rgba(255, 122, 26, 0.6);
      box-shadow:
        0 0 0 3px rgba(0, 0, 0, 0.5),
        0 0 30px rgba(255, 45, 149, 0.7),
        0 0 60px rgba(255, 122, 26, 0.5),
        inset 0 0 20px rgba(255, 255, 255, 0.1);
    }
    .avatar::before {
      content: '';
      position: absolute;
      inset: -8px;
      border-radius: 50%;
      background: conic-gradient(from 0deg, #ff7a1a, #ff2d95, #d100ff, #ff7a1a);
      z-index: -1;
      filter: blur(14px);
      opacity: 0.75;
      animation: spinGlow 6s linear infinite;
    }
    @keyframes spinGlow {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }
    @keyframes floatAvatar {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-6px); }
    }

    .profile-name {
      font-family: 'Unbounded', sans-serif;
      font-size: 30px;
      font-weight: 900;
      letter-spacing: 2px;
      margin-bottom: 8px;
      background: linear-gradient(90deg, #ff7a1a, #ff2d95, #d100ff, #ff7a1a);
      background-size: 300% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;
      animation: shineName 4s linear infinite;
      text-align: center;
      text-transform: uppercase;
    }
    @keyframes shineName {
      0%   { background-position: 0% 50%; }
      100% { background-position: 300% 50%; }
    }

    .profile-bio {
      font-family: 'Manrope', sans-serif;
      font-size: 13.5px;
      font-weight: 500;
      color: var(--text-secondary);
      text-align: center;
      max-width: 320px;
      letter-spacing: 0.5px;
      animation: fadeInUp 0.7s ease-out 0.15s both;
    }

    /* ============ КНОПКИ-ССЫЛКИ (УЛУЧШЕННЫЕ) ============ */
    .links {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 20px;
    }

    .link-btn {
      position: relative;
      display: flex;
      align-items: center;
      gap: 14px;
      width: 100%;
      padding: 16px 18px;
      background: var(--bg-card);
      backdrop-filter: blur(28px) saturate(1.8);
      -webkit-backdrop-filter: blur(28px) saturate(1.8);
      border-radius: var(--radius);
      text-decoration: none;
      color: var(--text);
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.8px;
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1),
                  background 0.3s ease,
                  box-shadow 0.3s ease;
      overflow: hidden;
      isolation: isolate;
      /* Свечение вокруг кнопки */
      box-shadow:
        0 0 0 1px rgba(255, 122, 26, 0.15),
        0 4px 20px rgba(255, 45, 149, 0.15),
        0 0 30px rgba(209, 0, 255, 0.1);
    }

    /* Анимированная переливающаяся рамка */
    .link-btn::before {
      content: '';
      position: absolute;
      inset: -2px;
      border-radius: var(--radius);
      padding: 2px;
      background: linear-gradient(90deg, #ff7a1a, #ff2d95, #d100ff, #ff7a1a);
      background-size: 300% 100%;
      animation: shineBorder 3s linear infinite;
      -webkit-mask:
        linear-gradient(#000 0 0) content-box,
        linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      z-index: -1;
      opacity: 0.8;
    }
    @keyframes shineBorder {
      0%   { background-position: 0% 50%; }
      100% { background-position: 300% 50%; }
    }

    /* Блик внутри кнопки (диагональный) */
    .link-btn::after {
      content: '';
      position: absolute;
      top: 0; left: -100%;
      width: 60%;
      height: 100%;
      background: linear-gradient(90deg,
        transparent,
        rgba(255, 255, 255, 0.12),
        transparent);
      transform: skewX(-25deg);
      transition: left 0.6s ease;
      pointer-events: none;
    }
    .link-btn:hover::after { left: 150%; }

    .link-btn:hover {
      background: var(--bg-card-hover);
      transform: translateY(-3px) scale(1.015);
      box-shadow:
        0 0 0 1px rgba(255, 122, 26, 0.5),
        0 10px 40px rgba(255, 45, 149, 0.55),
        0 0 60px rgba(255, 122, 26, 0.4),
        0 0 90px rgba(209, 0, 255, 0.3);
    }
    .link-btn:hover::before { opacity: 1; }
    .link-btn:active { transform: scale(0.98); }

    .link-icon {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      position: relative;
      box-shadow: 0 4px 14px rgba(0,0,0,0.4);
      transition: transform 0.3s ease;
    }
    .link-btn:hover .link-icon {
      transform: rotate(-8deg) scale(1.12);
    }
    .link-icon svg { width: 22px; height: 22px; }

    .link-text {
      flex: 1;
      text-shadow: 0 1px 8px rgba(0, 0, 0, 0.7);
    }

    .link-arrow {
      color: rgba(255, 255, 255, 0.4);
      transition: transform 0.25s, color 0.25s;
    }
    .link-btn:hover .link-arrow {
      transform: translateX(5px);
      color: #ff7a1a;
    }
    .link-arrow svg { width: 18px; height: 18px; }

    /* ============ РАЗДЕЛИТЕЛЬ ============ */
    .divider {
      width: 60px;
      height: 2px;
      background: linear-gradient(90deg, #ff7a1a, #ff2d95, #d100ff);
      margin: 0 auto 14px;
      border-radius: 2px;
    }
    .section-title {
      font-family: 'Unbounded', sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 3px;
      color: var(--text-secondary);
      text-transform: uppercase;
      text-align: center;
      margin-bottom: 12px;
    }

    /* ============ СЕТКА ============ */
    .catalog-grid {
      display: grid;
      gap: 10px;
      margin-bottom: 16px;
    }
    .catalog-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 16px 10px;
      background: var(--bg-card);
      backdrop-filter: blur(20px) saturate(1.5);
      -webkit-backdrop-filter: blur(20px) saturate(1.5);
      border: 1px solid var(--border-card);
      border-radius: 14px;
      text-decoration: none;
      color: var(--text);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .catalog-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow);
      border-color: rgba(255, 45, 149, 0.6);
    }
    .catalog-card-icon {
      width: 34px; height: 34px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .catalog-card-icon svg { width: 17px; height: 17px; }
    .catalog-card-name { font-size: 12px; font-weight: 700; }

    /* ============ АНИМАЦИИ ============ */
    .animate-in {
      opacity: 0;
      animation: fadeInUp 0.6s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @supports (padding-bottom: env(safe-area-inset-bottom)) {
      .container { padding-bottom: calc(40px + env(safe-area-inset-bottom)); }
    }

    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      color: var(--text-secondary);
      font-size: 14px;
      letter-spacing: 2px;
    }

    /* ============================================================
       МОДАЛЬНЫЕ ОКНА (О стримере, Расписание)
       ============================================================ */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    .modal-backdrop.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal {
      position: relative;
      width: 100%;
      max-width: 420px;
      background: linear-gradient(135deg, rgba(20, 8, 25, 0.96), rgba(10, 4, 15, 0.98));
      border-radius: 24px;
      padding: 32px 28px 28px;
      box-shadow:
        0 0 0 1px rgba(255, 122, 26, 0.4),
        0 0 60px rgba(255, 45, 149, 0.5),
        0 0 120px rgba(209, 0, 255, 0.3),
        0 30px 80px rgba(0, 0, 0, 0.6);
      transform: scale(0.9) translateY(20px);
      transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      overflow: hidden;
    }
    .modal-backdrop.active .modal {
      transform: scale(1) translateY(0);
    }

    /* Переливающаяся рамка модального окна */
    .modal::before {
      content: '';
      position: absolute;
      inset: -2px;
      border-radius: 24px;
      padding: 2px;
      background: linear-gradient(90deg, #ff7a1a, #ff2d95, #d100ff, #ff7a1a);
      background-size: 300% 100%;
      animation: shineBorder 3s linear infinite;
      -webkit-mask:
        linear-gradient(#000 0 0) content-box,
        linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      z-index: -1;
      opacity: 0.9;
    }

    .modal-close {
      position: absolute;
      top: 14px;
      right: 14px;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 122, 26, 0.4);
      color: #fff;
      font-size: 20px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.25s ease;
      line-height: 1;
    }
    .modal-close:hover {
      background: rgba(255, 45, 149, 0.3);
      border-color: #ff2d95;
      transform: rotate(90deg) scale(1.1);
      box-shadow: 0 0 20px rgba(255, 45, 149, 0.6);
    }

    .modal-icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 18px;
      border-radius: 50%;
      background: linear-gradient(135deg, rgba(255, 122, 26, 0.25), rgba(255, 45, 149, 0.25));
      border: 2px solid rgba(255, 122, 26, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      box-shadow: 0 0 30px rgba(255, 45, 149, 0.5);
      animation: floatAvatar 3s ease-in-out infinite;
    }

    .modal-title {
      font-family: 'Unbounded', sans-serif;
      font-size: 22px;
      font-weight: 800;
      text-align: center;
      margin-bottom: 14px;
      background: linear-gradient(90deg, #ff7a1a, #ff2d95, #d100ff, #ff7a1a);
      background-size: 300% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;
      animation: shineName 4s linear infinite;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .modal-text {
      font-family: 'Manrope', sans-serif;
      font-size: 15px;
      line-height: 1.7;
      color: rgba(255, 255, 255, 0.85);
      text-align: center;
    }
    .modal-text strong {
      color: #ff7a1a;
      font-weight: 700;
    }

    html, body {
  -webkit-overflow-scrolling: touch;
  overscroll-behavior-y: none;
}

    @media (max-width: 768px) {
  .link-btn,
  .catalog-card,
  .modal {
    backdrop-filter: none !important;
    -webkit-backdrop-filter: none !important;
  }
}

    /* Отключаем все анимации на телефоне — убирает перезагрузку при скролле */
@media (max-width: 768px) {
  .animate-in {
    animation: none !important;
    opacity: 1 !important;
    transform: none !important;
  }
  .bg-shine,
  .avatar,
  .avatar::before,
  .profile-name,
  .link-btn::before,
  .link-btn::after {
    animation: none !important;
  }
  /* Убираем transition, чтобы кнопки не "дёргались" */
  .link-btn {
    transition: none !important;
  }
}
  </style>
</head>
<body>
  <div class="loading" id="loading">ЗАГРУЗКА...</div>

  <!-- МОДАЛЬНОЕ ОКНО: О стримере -->
  <div class="modal-backdrop" id="modal-about">
    <div class="modal">
      <button class="modal-close" data-close="modal-about">×</button>
      <div class="modal-icon">💖</div>
      <div class="modal-title">О стримере</div>
      <div class="modal-text">
        Люблю стримить 💖<br>
        А ещё я гуль
      </div>
    </div>
  </div>

  <!-- МОДАЛЬНОЕ ОКНО: Расписание -->
  <div class="modal-backdrop" id="modal-schedule">
    <div class="modal">
      <button class="modal-close" data-close="modal-schedule">×</button>
      <div class="modal-icon">⏰</div>
      <div class="modal-title">Расписание</div>
      <div class="modal-text">
        Стримлю <strong>круглосуточно</strong> —<br>
        с <strong>4–5 утра</strong> до <strong>00:00 ночи</strong>.<br><br>
        Заходи в любое время, всегда рад видеть! 🔥
      </div>
    </div>
  </div>

      youtube: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>',
      email: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/></svg>',
      send: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>',
      website: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 4 10 15 15 0 0 1-4 10 15 15 0 0 1-4-10 15 15 0 0 1 4-10Z"/></svg>',
      link: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>'
    };

    const ICON_COLORS = {
      whatsapp: '#25D366', instagram: '#E1306C', telegram: '#0088cc',
      twitter: '#fff', github: '#fff', linkedin: '#0A66C2',
      youtube: '#FF0000', tiktok: '#fff', discord: '#5865F2',
      spotify: '#1DB954', email: '#EA4335', website: '#ff7a1a',
      phone: '#25D366', location: '#FF6B6B', send: '#ff2d95',
      image: '#ff2d95', link: '#d100ff', threads: '#fff', snapchat: '#FFFC00',
      vk: '#4C75A3', twitch: '#9146FF'
    };

    const ICON_BG = {
      whatsapp: 'rgba(37, 211, 102, 0.2)',
      instagram: 'linear-gradient(135deg, rgba(131, 58, 180, 0.4), rgba(253, 29, 29, 0.4))',
      telegram: 'rgba(0, 136, 204, 0.25)',
      twitter: 'rgba(255, 255, 255, 0.1)',
      github: 'rgba(255, 255, 255, 0.1)',
      linkedin: 'rgba(10, 102, 194, 0.25)',
      youtube: 'rgba(255, 0, 0, 0.25)',
      tiktok: 'linear-gradient(135deg, rgba(0,0,0,0.5), rgba(255,0,80,0.3))',
      discord: 'rgba(88, 101, 242, 0.25)',
      spotify: 'rgba(29, 185, 84, 0.25)',
      email: 'rgba(234, 67, 53, 0.25)',
      website: 'linear-gradient(135deg, rgba(255,122,26,0.35), rgba(255,45,149,0.35))',
      phone: 'rgba(37, 211, 102, 0.25)',
      location: 'rgba(255, 107, 107, 0.25)',
      send: 'linear-gradient(135deg, rgba(255,122,26,0.35), rgba(255,45,149,0.35))',
      image: 'rgba(255, 45, 149, 0.25)',
      link: 'linear-gradient(135deg, rgba(255,122,26,0.35), rgba(209,0,255,0.35))',
      threads: 'rgba(255, 255, 255, 0.1)',
      snapchat: 'rgba(255, 252, 0, 0.2)',
      vk: 'rgba(76, 117, 163, 0.3)',
      twitch: 'rgba(145, 70, 255, 0.3)'
    };

    const ARROW_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>';

    let iconsLoaded = false;
    let iconsDoc = null;

    async function loadIcons() {
      try {
        const res = await fetch('icons.svg');
        const text = await res.text();
        const parser = new DOMParser();
        iconsDoc = parser.parseFromString(text, 'image/svg+xml');
        iconsLoaded = true;
      } catch (e) {
        console.warn('icons.svg не загружен — используем встроенные иконки');
      }
    }

    function getIconSVG(name) {
      if (INLINE_ICONS[name]) return INLINE_ICONS[name];
      if (!iconsLoaded || !iconsDoc) return INLINE_ICONS.link;
      const symbol = iconsDoc.querySelector('#icon-' + name);
      if (!symbol) return INLINE_ICONS.link;
      const viewBox = symbol.getAttribute('viewBox') || '0 0 24 24';
      return '<svg viewBox="' + viewBox + '">' + symbol.innerHTML + '</svg>';
    }

    function detectLang(config) {
      if (!config.i18n || !config.i18n.enabled) return null;
      const lang = (navigator.language || navigator.userLanguage || config.i18n.default || 'en').slice(0, 2).toLowerCase();
      if (config.i18n.translations && config.i18n.translations[lang]) return lang;
      return config.i18n.default || null;
    }
    function t(text, config, lang) {
      if (!lang || !config.i18n || !config.i18n.translations) return text;
      const tr = config.i18n.translations[lang];
      return (tr && tr[text]) || text;
    }

    /* ВИДЕО-ФОН — только на ПК, на телефоне — градиент */
function renderVideoBackground() {
  const isMobile = window.innerWidth <= 768;

  // На телефоне видео вообще не создаём
  if (isMobile) {
    // Только подложки
    const overlay = document.createElement('div');
    overlay.className = 'bg-overlay';
    document.body.prepend(overlay);

    const shine = document.createElement('div');
    shine.className = 'bg-shine';
    document.body.prepend(shine);
    return;
  }

  // На ПК — видео, как было
  const pc = document.createElement('video');
  pc.id = 'bg-video-pc';
  pc.className = 'bg-video';
  pc.src = 'video/pc.mp4';
  pc.autoplay = true; pc.loop = true; pc.muted = true; pc.defaultMuted = true;
  pc.setAttribute('muted', '');
  pc.setAttribute('playsinline', '');
  pc.setAttribute('webkit-playsinline', '');
  pc.setAttribute('preload', 'auto');
  document.body.prepend(pc);

  const tryPlay = function() { pc.play().catch(function() {}); };
  setTimeout(tryPlay, 100);
  document.addEventListener('click', tryPlay, { once: true });

  const overlay = document.createElement('div');
  overlay.className = 'bg-overlay';
  document.body.prepend(overlay);

  const shine = document.createElement('div');
  shine.className = 'bg-shine';
  document.body.prepend(shine);
}

    /* ПРОФИЛЬ */
    function renderProfile(config, lang) {
      const profile = document.createElement('div');
      profile.className = 'profile';

      const avatarWrap = document.createElement('div');
      avatarWrap.className = 'avatar';
      const img = document.createElement('img');
      img.src = 'video/avatar.jpg';
      img.alt = config.name || 'avatar';
      img.loading = 'eager';
      img.onerror = function() { avatarWrap.style.display = 'none'; };
      avatarWrap.appendChild(img);
      profile.appendChild(avatarWrap);

      if (config.name) {
        const name = document.createElement('div');
        name.className = 'profile-name';
        name.textContent = config.name;
        profile.appendChild(name);
      }
      if (config.bio) {
        const bio = document.createElement('div');
        bio.className = 'profile-bio';
        bio.textContent = t(config.bio, config, lang);
        profile.appendChild(bio);
      }
      return profile;
    }

    /* КНОПКИ */
    function renderLinks(links, config, lang) {
      const container = document.createElement('div');
      container.className = 'links';

      links.forEach(function(link, i) {
        const isModal = link.action === 'about' || link.action === 'schedule';
        const a = document.createElement(isModal ? 'button' : 'a');

        if (isModal) {
          a.type = 'button';
          a.addEventListener('click', function() {
            const modal = document.getElementById('modal-' + link.action);
            if (modal) modal.classList.add('active');
          });
        } else {
          a.href = link.url;
          a.target = '_blank';
          a.rel = 'noopener noreferrer';
        }

        a.className = 'link-btn animate-in';
        a.style.animationDelay = (0.2 + i * 0.07) + 's';
        if (isModal) a.style.cursor = 'pointer';
        a.style.fontFamily = "'Plus Jakarta Sans', sans-serif";

        const iconName = link.icon || 'link';
        const color = ICON_COLORS[iconName] || '#fff';
        const bg = ICON_BG[iconName] || 'rgba(255,255,255,0.1)';

        const iconDiv = document.createElement('div');
        iconDiv.className = 'link-icon';
        iconDiv.style.background = bg;
        iconDiv.style.color = color;
        iconDiv.innerHTML = getIconSVG(iconName);

        const text = document.createElement('span');
        text.className = 'link-text';
        text.textContent = t(link.title, config, lang);

        const arrow = document.createElement('span');
        arrow.className = 'link-arrow';
        arrow.innerHTML = ARROW_SVG;

        a.appendChild(iconDiv);
        a.appendChild(text);
        a.appendChild(arrow);
        container.appendChild(a);
      });

      return container;
    }

    /* СЕКЦИИ */
    function renderSection(section, config, lang, startDelay) {
      const fragment = document.createDocumentFragment();
      const divider = document.createElement('div');
      divider.className = 'divider';
      fragment.appendChild(divider);

      if (section.title) {
        const title = document.createElement('div');
        title.className = 'section-title';
        title.textContent = t(section.title, config, lang);
        fragment.appendChild(title);
      }

      if (section.type === 'grid' && section.items) {
        const grid = document.createElement('div');
        grid.className = 'catalog-grid';
        grid.style.gridTemplateColumns = 'repeat(' + (section.columns || 2) + ', 1fr)';

        section.items.forEach(function(item, i) {
          const card = document.createElement('a');
          card.href = item.url;
          card.target = '_blank';
          card.rel = 'noopener noreferrer';
          card.className = 'catalog-card animate-in';
          card.style.animationDelay = (startDelay + i * 0.05) + 's';

          const iconName = item.icon || 'link';
          const iconDiv = document.createElement('div');
          iconDiv.className = 'catalog-card-icon';
          iconDiv.style.background = ICON_BG[iconName] || 'rgba(255,255,255,0.1)';
          iconDiv.style.color = ICON_COLORS[iconName] || '#fff';
          iconDiv.innerHTML = getIconSVG(iconName);

          const name = document.createElement('span');
          name.className = 'catalog-card-name';
          name.textContent = t(item.title, config, lang);

          card.appendChild(iconDiv);
          card.appendChild(name);
          grid.appendChild(card);
        });
        fragment.appendChild(grid);
      }
      return fragment;
    }

    function applySEO(config) {
      if (config.seo) {
        if (config.seo.title) document.title = config.seo.title;
        if (config.seo.description) {
          const m = document.querySelector('meta[name="description"]');
          if (m) m.content = config.seo.description;
        }
      } else if (config.name) {
        document.title = config.name;
      }
    }

    /* МОДАЛЬНЫЕ ОКНА — закрытие */
    function setupModals() {
      // Кнопки закрытия (крестик)
      document.querySelectorAll('.modal-close').forEach(function(btn) {
        btn.addEventListener('click', function() {
          const id = btn.getAttribute('data-close');
          const modal = document.getElementById(id);
          if (modal) modal.classList.remove('active');
        });
      });

      // Клик по фону вокруг окна
      document.querySelectorAll('.modal-backdrop').forEach(function(backdrop) {
        backdrop.addEventListener('click', function(e) {
          if (e.target === backdrop) backdrop.classList.remove('active');
        });
      });

      // Escape
      document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
          document.querySelectorAll('.modal-backdrop.active').forEach(function(m) {
            m.classList.remove('active');
          });
        }
      });
    }

    /* ИНИЦИАЛИЗАЦИЯ */
    async function init() {
      try {
        const [configRes] = await Promise.all([
          fetch('config.json'),
          loadIcons()
        ]);
        const config = await configRes.json();
        const lang = detectLang(config);

        document.getElementById('loading').remove();

        renderVideoBackground();
        applySEO(config);

        const container = document.createElement('div');
        container.className = 'container';
        container.appendChild(renderProfile(config, lang));

        if (config.links && config.links.length) {
          container.appendChild(renderLinks(config.links, config, lang));
        }
        if (config.sections && config.sections.length) {
          let delay = 0.2 + (config.links ? config.links.length * 0.07 : 0) + 0.1;
          config.sections.forEach(function(section) {
            container.appendChild(renderSection(section, config, lang, delay));
            delay += (section.items ? section.items.length * 0.05 : 0) + 0.1;
          });
        }
        document.body.appendChild(container);

        setupModals();
      } catch (e) {
        const el = document.getElementById('loading');
        if (el) el.textContent = 'Ошибка загрузки';
        console.error(e);
      }
    }

    init();
  </script>
</body>
